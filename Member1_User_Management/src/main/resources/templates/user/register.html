<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Member 1 - Register User</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>body { background-color: #0b1120; color: #f8fafc; font-family: 'Segoe UI', system-ui, sans-serif; }</style>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-5" style="max-width: 650px;">
    <div class="card bg-dark border-secondary shadow-lg p-4">
        <div class="card-body">
            <div class="text-center mb-4">
                <span class="badge bg-info text-dark px-3 py-1 mb-2">Member 1 &bull; UI 1 (Create)</span>
                <h2 class="fw-bold text-white"><i class="bi bi-person-plus text-info me-2"></i>Register New User</h2>
                <p class="text-secondary small">User Authentication & Loyalty Rewards Engine</p>
            </div>

            <!-- Flash Alert Messages -->
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${errorMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <form action="/users/register" method="POST">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label text-light">Username</label>
                        <input type="text" name="username" class="form-control bg-dark border-secondary text-white" placeholder="e.g. john_doe" required minlength="3">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-light">Password</label>
                        <input type="password" name="password" class="form-control bg-dark border-secondary text-white" placeholder="Min 6 characters" required minlength="6">
                    </div>
                    <div class="col-12">
                        <label class="form-label text-light">Full Name</label>
                        <input type="text" name="fullName" class="form-control bg-dark border-secondary text-white" placeholder="e.g. Johnathan Doe" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-light">Email Address</label>
                        <input type="email" name="email" class="form-control bg-dark border-secondary text-white" placeholder="john@example.com" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-light">Phone Number</label>
                        <input type="text" name="phone" class="form-control bg-dark border-secondary text-white" placeholder="0771234567" required>
                    </div>
                    <div class="col-12">
                        <label class="form-label text-light">Membership Tier (OOP Polymorphism)</label>
                        <select name="membershipType" class="form-select bg-dark border-secondary text-white">
                            <option value="REGULAR">Regular Member (10 Signup Points, 5% Discount)</option>
                            <option value="PREMIUM">Premium Member (50 Bonus Points, 15% VIP Discount)</option>
                            <option value="ADMIN">Cinema Staff Administrator</option>
                        </select>
                    </div>
                    <div class="col-12 mt-4">
                        <button type="submit" class="btn btn-info w-100 fw-bold py-2 shadow">
                            <i class="bi bi-check-circle me-1"></i> Complete Registration
                        </button>
                    </div>
                </div>
            </form>

            <div class="text-center mt-3">
                <a href="/users" class="text-secondary small text-decoration-none">
                    <i class="bi bi-arrow-left me-1"></i> Back to User Directory (UI 2)
                </a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
