<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Member 1 - User Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>body { background-color: #0b1120; color: #f8fafc; font-family: 'Segoe UI', system-ui, sans-serif; }</style>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-5" style="max-width: 750px;">
    <!-- Alert Messages -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card bg-dark border-secondary shadow-lg p-4">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom border-secondary">
                <div>
                    <span class="badge bg-info text-dark px-3 py-1 mb-2">Member 1 &bull; UI 3 (Read & Update)</span>
                    <h2 class="fw-bold text-white mb-0" th:text="${user.fullName}">Johnathan Doe</h2>
                    <span class="text-secondary small" th:text="'User ID: ' + ${user.userId}">USR-001</span>
                </div>
                <div class="text-end">
                    <span class="badge bg-warning text-dark fs-6 px-3 py-2 fw-bold" th:text="${badge}">Regular Member</span>
                </div>
            </div>

            <!-- Profile Details Grid -->
            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <div class="p-3 bg-black rounded border border-secondary">
                        <small class="text-secondary d-block">Username</small>
                        <span class="fw-semibold text-white" th:text="'@' + ${user.username}">@john</span>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="p-3 bg-black rounded border border-secondary">
                        <small class="text-secondary d-block">Email Address</small>
                        <span class="fw-semibold text-white" th:text="${user.email}">john@example.com</span>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="p-3 bg-black rounded border border-secondary">
                        <small class="text-secondary d-block">Phone Number</small>
                        <span class="fw-semibold text-white" th:text="${user.phone}">0771234567</span>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="p-3 bg-black rounded border border-secondary">
                        <small class="text-secondary d-block">Account Created Date</small>
                        <span class="fw-semibold text-white" th:text="${user.createdDate}">2026-11-10</span>
                    </div>
                </div>
            </div>

            <!-- Polymorphic Rewards Engine Box -->
            <div class="card bg-black border-info mb-4">
                <div class="card-body p-3">
                    <h5 class="fw-bold text-info mb-3"><i class="bi bi-gift me-2"></i>OOP Polymorphism & Loyalty Benefits</h5>
                    <div class="row text-center g-2">
                        <div class="col-6">
                            <div class="p-2 border border-secondary rounded">
                                <span class="d-block text-secondary small">Tier Discount</span>
                                <h3 class="fw-bold text-warning mb-0" th:text="${discountRate}">5%</h3>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="p-2 border border-secondary rounded">
                                <span class="d-block text-secondary small">Tier Class Type</span>
                                <h6 class="fw-bold text-light mb-0 mt-2" th:text="${user.class.simpleName}">RegularUser</h6>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Upgrade Membership Tier Form (Update) -->
            <form th:action="@{'/users/profile/' + ${user.userId} + '/upgrade'}" method="POST" class="border-top border-secondary pt-3">
                <label class="form-label text-light fw-bold">Upgrade Membership Tier (Update)</label>
                <div class="input-group">
                    <select name="newTier" class="form-select bg-dark border-secondary text-white">
                        <option value="REGULAR">Regular Member (5% Discount)</option>
                        <option value="PREMIUM">Premium VIP Tier (15% Discount + Loyalty Perks)</option>
                        <option value="ADMIN">Cinema Administrator Access</option>
                    </select>
                    <button type="submit" class="btn btn-warning fw-bold px-4">
                        <i class="bi bi-arrow-up-circle me-1"></i> Update Tier
                    </button>
                </div>
            </form>

            <div class="mt-4 text-center">
                <a href="/users" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left me-1"></i> Back to User Directory (UI 2)
                </a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
