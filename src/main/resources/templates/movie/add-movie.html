<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Member 2 - Add Movie</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>body { background-color: #0b1120; color: #f8fafc; font-family: 'Segoe UI', system-ui, sans-serif; }</style>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-5" style="max-width: 700px;">
    <div class="card bg-dark border-secondary shadow-lg p-4">
        <div class="card-body">
            <div class="text-center mb-4">
                <span class="badge bg-warning text-dark px-3 py-1 mb-2">Member 2 &bull; UI 1 (Create)</span>
                <h2 class="fw-bold text-white"><i class="bi bi-film text-warning me-2"></i>Add New Movie</h2>
                <p class="text-secondary small">Movie Format Hierarchy (Standard, 3D, IMAX)</p>
            </div>

            <!-- Flash Error Message -->
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${errorMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <form action="/movies/add" method="POST">
                <div class="row g-3">
                    <div class="col-md-8">
                        <label class="form-label text-light">Movie Title</label>
                        <input type="text" name="title" class="form-control bg-dark border-secondary text-white" placeholder="e.g. Dune: Part Two" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label text-light">Duration (Minutes)</label>
                        <input type="number" name="duration" class="form-control bg-dark border-secondary text-white" placeholder="120" min="30" max="360" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-light">Genre</label>
                        <select name="genre" class="form-select bg-dark border-secondary text-white">
                            <option value="Sci-Fi">Sci-Fi</option>
                            <option value="Action">Action</option>
                            <option value="Adventure">Adventure</option>
                            <option value="Animation">Animation</option>
                            <option value="Drama">Drama</option>
                            <option value="Horror">Horror</option>
                            <option value="Comedy">Comedy</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-light">Language</label>
                        <input type="text" name="language" class="form-control bg-dark border-secondary text-white" value="English" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-light">Age Rating</label>
                        <select name="ageRating" class="form-select bg-dark border-secondary text-white">
                            <option value="G">G - General Audiences</option>
                            <option value="PG">PG - Parental Guidance</option>
                            <option value="PG-13" selected>PG-13 - Parents Strongly Cautioned</option>
                            <option value="R">R - Restricted</option>
                            <option value="NC-17">NC-17 - Adults Only</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-light">Format Type (Polymorphism)</label>
                        <select name="formatType" class="form-select bg-dark border-secondary text-white">
                            <option value="STANDARD">Standard 2D</option>
                            <option value="3D">RealD 3D (Glasses Included)</option>
                            <option value="IMAX">IMAX with Laser Sound</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <label class="form-label text-light">Poster Image URL</label>
                        <input type="url" name="posterUrl" class="form-control bg-dark border-secondary text-white" placeholder="https://example.com/poster.jpg">
                    </div>
                    <div class="col-12">
                        <label class="form-label text-light">Synopsis / Description</label>
                        <textarea name="description" class="form-control bg-dark border-secondary text-white" rows="2" placeholder="Brief synopsis of the film..."></textarea>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-light">Release Date</label>
                        <input type="date" name="releaseDate" class="form-control bg-dark border-secondary text-white" value="2026-11-10" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-light">Status</label>
                        <select name="status" class="form-select bg-dark border-secondary text-white">
                            <option value="NOW_SHOWING">Now Showing</option>
                            <option value="COMING_SOON">Coming Soon</option>
                        </select>
                    </div>
                    <div class="col-12 mt-4">
                        <button type="submit" class="btn btn-warning w-100 fw-bold py-2 shadow">
                            <i class="bi bi-plus-circle me-1"></i> Add Movie to Catalog
                        </button>
                    </div>
                </div>
            </form>

            <div class="text-center mt-3">
                <a href="/movies" class="text-secondary small text-decoration-none">
                    <i class="bi bi-arrow-left me-1"></i> Back to Movie Catalog (UI 2)
                </a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
