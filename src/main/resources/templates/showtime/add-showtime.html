<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Member 4 - Schedule Showtime</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>body { background-color: #0b1120; color: #f8fafc; font-family: 'Segoe UI', system-ui, sans-serif; }</style>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-5" style="max-width: 650px;">
    <div class="card bg-dark border-secondary shadow-lg p-4">
        <div class="card-body">
            <div class="text-center mb-4">
                <span class="badge bg-danger text-white px-3 py-1 mb-2">Member 4 &bull; UI 1 (Create)</span>
                <h2 class="fw-bold text-white"><i class="bi bi-calendar-plus text-danger me-2"></i>Schedule Showtime</h2>
                <p class="text-secondary small">Auditorium Conflict Detection & 15-Minute Cleaning Buffer</p>
            </div>

            <!-- Error Alerts -->
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${errorMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <form action="/showtimes/add" method="POST">
                <div class="row g-3">
                    <div class="col-12">
                        <label class="form-label text-light">Select Movie</label>
                        <select name="movieId" class="form-select bg-dark border-secondary text-white" required>
                            <option th:each="m : ${movies}" th:value="${m.movieId}" th:text="${m.title + ' (' + m.formatType + ' &bull; ' + m.duration + 'm)'}"></option>
                        </select>
                    </div>
                    <div class="col-12">
                        <label class="form-label text-light">Select Cinema Hall</label>
                        <select name="hallId" class="form-select bg-dark border-secondary text-white" required>
                            <option th:each="h : ${halls}" th:value="${h.hallId}" th:text="${h.name + ' (' + h.hallType + ')'}"></option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-light">Screening Date</label>
                        <input type="date" name="showDate" class="form-control bg-dark border-secondary text-white" value="2026-11-10" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-light">Base Ticket Price ($)</label>
                        <input type="number" step="0.5" name="basePrice" class="form-control bg-dark border-secondary text-white" value="12.00" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-light">Start Time (HH:mm)</label>
                        <input type="time" name="startTime" class="form-control bg-dark border-secondary text-white" value="14:00" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-light">End Time (HH:mm)</label>
                        <input type="time" name="endTime" class="form-control bg-dark border-secondary text-white" value="16:30" required>
                    </div>
                    <div class="col-12 mt-4">
                        <button type="submit" class="btn btn-danger w-100 fw-bold py-2 shadow">
                            <i class="bi bi-clock-history me-1"></i> Confirm & Schedule Showtime
                        </button>
                    </div>
                </div>
            </form>

            <div class="text-center mt-3">
                <a href="/showtimes" class="text-secondary small text-decoration-none">
                    <i class="bi bi-arrow-left me-1"></i> Back to Screening Timetable (UI 2)
                </a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
