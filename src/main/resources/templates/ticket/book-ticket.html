<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Member 5 - Book Movie Tickets</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>body { background-color: #0b1120; color: #f8fafc; font-family: 'Segoe UI', system-ui, sans-serif; }</style>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-5" style="max-width: 700px;">
    <div class="card bg-dark border-secondary shadow-lg p-4">
        <div class="card-body">
            <div class="text-center mb-4">
                <span class="badge bg-primary text-white px-3 py-1 mb-2">Member 5 &bull; UI 1 (Create)</span>
                <h2 class="fw-bold text-white"><i class="bi bi-ticket-perforated text-primary me-2"></i>Book Movie Tickets</h2>
                <p class="text-secondary small">Polymorphic Ticket Pricing (Standard, Student 20% Off, VIP 1.5x Multiplier)</p>
            </div>

            <!-- Error Alerts -->
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${errorMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <form action="/bookings/new" method="POST">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label text-light">Customer (Member 1)</label>
                        <select name="userId" class="form-select bg-dark border-secondary text-white" required>
                            <option th:each="u : ${users}" th:value="${u.userId}" th:text="${u.fullName + ' (' + u.membershipBadge + ')'}"></option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-light">Showtime Event (Member 4)</label>
                        <select name="showtimeId" class="form-select bg-dark border-secondary text-white" required>
                            <option th:each="s : ${showtimes}" th:value="${s.showtimeId}" th:text="${s.showtimeId + ' &bull; ' + s.showDate + ' ' + s.startTime}"></option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-light">Seat Numbers (From Member 3)</label>
                        <input type="text" name="seatNumbers" class="form-control bg-dark border-secondary text-white" placeholder="e.g. A1, A2" value="A1, A2" required>
                        <div class="form-text text-secondary">Comma-separated seat letters.</div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-light">Ticket Tier (Polymorphism)</label>
                        <select name="ticketType" class="form-select bg-dark border-secondary text-white">
                            <option value="STANDARD">Standard Ticket (Full Fare)</option>
                            <option value="STUDENT">Student Ticket (20% Educational Discount)</option>
                            <option value="VIP">VIP Ticket (1.5x Fare + Complimentary Popcorn)</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-light">Show Base Price ($)</label>
                        <input type="number" step="0.5" name="basePrice" class="form-control bg-dark border-secondary text-white" value="12.00">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-light">Hall Multiplier (Member 3)</label>
                        <input type="number" step="0.1" name="hallMultiplier" class="form-control bg-dark border-secondary text-white" value="1.0">
                    </div>
                    <div class="col-12 mt-4">
                        <button type="submit" class="btn btn-primary w-100 fw-bold py-2 shadow">
                            <i class="bi bi-cart-check me-1"></i> Confirm & Generate Booking
                        </button>
                    </div>
                </div>
            </form>

            <div class="text-center mt-3">
                <a href="/bookings" class="text-secondary small text-decoration-none">
                    <i class="bi bi-arrow-left me-1"></i> View Master Bookings Registry (UI 3)
                </a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
