<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Member 3 - Hold & Lock Seats</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>body { background-color: #0b1120; color: #f8fafc; font-family: 'Segoe UI', system-ui, sans-serif; }</style>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-5" style="max-width: 650px;">
    <div class="card bg-dark border-secondary shadow-lg p-4">
        <div class="card-body">
            <div class="text-center mb-4">
                <span class="badge bg-success text-white px-3 py-1 mb-2">Member 3 &bull; UI 2 (Create / Hold)</span>
                <h2 class="fw-bold text-white"><i class="bi bi-lock text-success me-2"></i>Hold / Lock Seats</h2>
                <p class="text-secondary small">Real-Time Double-Booking Collision Prevention Engine</p>
            </div>

            <!-- Error Alerts -->
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${errorMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <form action="/seats/lock" method="POST">
                <div class="mb-3">
                    <label class="form-label text-light">Auditorium Hall</label>
                    <select name="hallId" class="form-select bg-dark border-secondary text-white">
                        <option th:each="h : ${halls}" th:value="${h.hallId}" th:text="${h.name + ' (' + h.hallType + ' - ' + h.hallPriceMultiplier + 'x)'}" th:selected="${h.hallId == hallId}"></option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label text-light">Showtime Event Code</label>
                    <input type="text" name="showtimeId" th:value="${showtimeId}" class="form-control bg-dark border-secondary text-white" required>
                </div>
                <div class="mb-3">
                    <label class="form-label text-light">Seat Codes to Lock (Comma-separated)</label>
                    <input type="text" name="seatCodes" class="form-control bg-dark border-secondary text-white" placeholder="e.g. A3, B4, C2" required>
                    <div class="form-text text-secondary">Entering already-reserved or held seats will trigger collision prevention.</div>
                </div>
                <div class="mt-4">
                    <button type="submit" class="btn btn-success w-100 fw-bold py-2 shadow">
                        <i class="bi bi-shield-lock me-1"></i> Attempt Seat Lock
                    </button>
                </div>
            </form>

            <!-- Release Seats Box -->
            <form action="/seats/release" method="POST" class="mt-4 pt-3 border-top border-secondary">
                <input type="hidden" name="hallId" th:value="${hallId}">
                <input type="hidden" name="showtimeId" th:value="${showtimeId}">
                <label class="form-label text-warning small fw-bold">Release / Cancel Held Seats</label>
                <div class="input-group">
                    <input type="text" name="seatCodes" class="form-control bg-dark border-secondary text-white form-control-sm" placeholder="Seat codes (e.g. B3, B4)">
                    <button type="submit" class="btn btn-outline-warning btn-sm">Release Seats</button>
                </div>
            </form>

            <div class="text-center mt-4">
                <a th:href="@{'/seats/layout?hallId=' + ${hallId} + '&showtimeId=' + ${showtimeId}}" class="text-secondary small text-decoration-none">
                    <i class="bi bi-arrow-left me-1"></i> Back to Visual Seat Layout (UI 1)
                </a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
