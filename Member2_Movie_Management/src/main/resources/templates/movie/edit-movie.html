<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Member 2 - Edit Movie</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>body { background-color: #0b1120; color: #f8fafc; font-family: 'Segoe UI', system-ui, sans-serif; }</style>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-5" style="max-width: 650px;">
    <div class="card bg-dark border-secondary shadow-lg p-4">
        <div class="card-body">
            <div class="text-center mb-4">
                <span class="badge bg-warning text-dark px-3 py-1 mb-2">Member 2 &bull; UI 3 (Update & Delete)</span>
                <h2 class="fw-bold text-white"><i class="bi bi-pencil-square text-warning me-2"></i>Manage Movie</h2>
                <h5 class="text-warning" th:text="${movie.title}">Movie Title</h5>
                <span class="text-secondary small" th:text="'Movie ID: ' + ${movie.movieId}">MOV-001</span>
            </div>

            <!-- Current Details Card -->
            <div class="p-3 bg-black rounded border border-secondary mb-4">
                <div class="row g-2 small">
                    <div class="col-6"><span class="text-secondary">Genre:</span> <strong th:text="${movie.genre}">Sci-Fi</strong></div>
                    <div class="col-6"><span class="text-secondary">Duration:</span> <strong th:text="${movie.duration} + ' mins'">120 mins</strong></div>
                    <div class="col-6"><span class="text-secondary">Rating:</span> <strong th:text="${movie.ageRating}">PG-13</strong></div>
                    <div class="col-6"><span class="text-secondary">Format:</span> <strong th:text="${movie.formatType}">IMAX</strong></div>
                    <div class="col-12"><span class="text-secondary">Release Date:</span> <strong th:text="${movie.releaseDate}">2026-11-10</strong></div>
                </div>
            </div>

            <!-- Update Status Form -->
            <form th:action="@{'/movies/edit/' + ${movie.movieId}}" method="POST" class="mb-4">
                <label class="form-label text-light fw-bold">Update Screening Status (Update)</label>
                <div class="input-group">
                    <select name="status" class="form-select bg-dark border-secondary text-white">
                        <option value="NOW_SHOWING" th:selected="${movie.status == 'NOW_SHOWING'}">NOW_SHOWING (Active in theaters)</option>
                        <option value="COMING_SOON" th:selected="${movie.status == 'COMING_SOON'}">COMING_SOON (Upcoming title)</option>
                        <option value="ARCHIVED" th:selected="${movie.status == 'ARCHIVED'}">ARCHIVED (Ended screening)</option>
                    </select>
                    <button type="submit" class="btn btn-warning fw-bold px-4">Save Status</button>
                </div>
            </form>

            <!-- Delete Movie Form -->
            <form th:action="@{'/movies/delete/' + ${movie.movieId}}" method="POST" onsubmit="return confirm('Are you sure you want to permanently delete this movie?');">
                <div class="p-3 border border-danger rounded bg-black d-flex justify-content-between align-items-center">
                    <div>
                        <strong class="text-danger d-block">Delete Movie Record (Delete)</strong>
                        <small class="text-secondary">Removes the film entry from <code>data/movies.txt</code></small>
                    </div>
                    <button type="submit" class="btn btn-danger btn-sm px-3">
                        <i class="bi bi-trash me-1"></i> Delete
                    </button>
                </div>
            </form>

            <div class="mt-4 text-center">
                <a href="/movies" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left me-1"></i> Back to Movie Catalog (UI 2)
                </a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
