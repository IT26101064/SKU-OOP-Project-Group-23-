<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Member 2 - Movie Catalog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background-color: #0b1120; color: #f8fafc; font-family: 'Segoe UI', system-ui, sans-serif; }
        .movie-card { background: #1e293b; border: 1px solid #334155; border-radius: 0.75rem; overflow: hidden; transition: transform 0.2s; height: 100%; }
        .movie-card:hover { transform: translateY(-5px); border-color: #f59e0b; }
        .movie-poster { height: 260px; object-fit: cover; width: 100%; background: #0f172a; }
    </style>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-5">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
        <div>
            <span class="badge bg-warning text-dark px-3 py-1 mb-2">Member 2 &bull; UI 2 (Read)</span>
            <h2 class="fw-bold text-white"><i class="bi bi-camera-reels text-warning me-2"></i>Cinema Movie Catalog</h2>
            <p class="text-secondary small mb-0">Local File Persistence: <code>data/movies.txt</code></p>
        </div>
        <a href="/movies/add" class="btn btn-warning fw-bold shadow-sm">
            <i class="bi bi-plus-circle me-1"></i> Add New Movie (UI 1)
        </a>
    </div>

    <!-- Alert Messages -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Filter & Search Bar -->
    <div class="card bg-dark border-secondary p-3 mb-4">
        <form action="/movies" method="GET" class="row g-2 align-items-center">
            <div class="col-md-5">
                <input type="text" name="search" th:value="${searchQuery}" class="form-control bg-dark border-secondary text-white" placeholder="Search by title...">
            </div>
            <div class="col-md-3">
                <select name="genre" class="form-select bg-dark border-secondary text-white">
                    <option value="ALL">All Genres</option>
                    <option value="Sci-Fi">Sci-Fi</option>
                    <option value="Action">Action</option>
                    <option value="Adventure">Adventure</option>
                    <option value="Animation">Animation</option>
                    <option value="Drama">Drama</option>
                </select>
            </div>
            <div class="col-md-2">
                <div class="form-check text-light">
                    <input class="form-check-input" type="checkbox" name="nowShowing" value="true" id="nowShowingCheck" th:checked="${nowShowingOnly}">
                    <label class="form-check-label small" for="nowShowingCheck">Now Showing Only</label>
                </div>
            </div>
            <div class="col-md-2 text-end">
                <button type="submit" class="btn btn-warning w-100">Filter</button>
            </div>
        </form>
    </div>

    <!-- Movie Cards Grid -->
    <div class="row g-4">
        <div class="col-md-6 col-lg-4" th:each="m : ${movies}">
            <div class="movie-card d-flex flex-column">
                <img th:src="${m.posterUrl}" th:alt="${m.title}" class="movie-poster" onerror="this.src='https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=500&q=80'">
                <div class="p-3 d-flex flex-column flex-grow-1">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <span class="badge bg-danger" th:text="${m.ageRating}">PG-13</span>
                        <span class="badge bg-secondary" th:text="${m.formatType}">IMAX</span>
                    </div>
                    <h5 class="fw-bold text-white mb-1" th:text="${m.title}">Movie Title</h5>
                    <p class="text-secondary small mb-2" th:text="${m.genre} + ' &bull; ' + ${m.duration} + ' mins &bull; ' + ${m.language}">Sci-Fi &bull; 165 mins</p>
                    <p class="text-slate-300 small flex-grow-1" style="color: #cbd5e1;" th:text="${m.description}">Movie description text...</p>
                    <div class="d-flex justify-content-between align-items-center mt-3 pt-2 border-top border-secondary">
                        <span class="badge bg-success" th:if="${m.isNowShowing()}">Now Showing</span>
                        <span class="badge bg-secondary" th:unless="${m.isNowShowing()}">Coming Soon</span>
                        <div>
                            <a th:href="@{'/movies/edit/' + ${m.movieId}}" class="btn btn-sm btn-outline-warning">
                                <i class="bi bi-pencil-square"></i> Manage (UI 3)
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(movies)}" class="col-12 text-center py-5">
            <i class="bi bi-camera-reels text-secondary" style="font-size: 3rem;"></i>
            <h5 class="text-secondary mt-3">No movies found matching criteria.</h5>
            <a href="/movies" class="btn btn-outline-warning mt-2">Reset Filters</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
